<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育预测系统 - Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .last-update {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card .change {
            font-size: 0.9em;
            margin-top: 10px;
        }

        .change.positive { color: #10b981; }
        .change.negative { color: #ef4444; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-card h3 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏆 体育预测系统 Dashboard</h1>
            <p>实时监控股市预测表现和数据分析</p>
            <p class="last-update">最后更新：<span id="last-update">加载中...</span></p>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            正在加载数据...
        </div>

        <!-- Content -->
        <div id="content" style="display: none;">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>总预测数</h3>
                    <div class="value" id="total-predictions">-</div>
                    <div class="change" id="total-change">-</div>
                </div>
                <div class="stat-card">
                    <h3>准确率</h3>
                    <div class="value" id="accuracy">-</div>
                    <div class="change" id="accuracy-change">-</div>
                </div>
                <div class="stat-card">
                    <h3>平均置信度</h3>
                    <div class="value" id="avg-confidence">-</div>
                    <div class="change" id="confidence-change">-</div>
                </div>
                <div class="stat-card">
                    <h3>活跃联赛</h3>
                    <div class="value" id="active-leagues">-</div>
                    <div class="change" id="leagues-change">-</div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>📈 预测趋势（30 天）</h3>
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>🎯 置信度校准曲线</h3>
                    <canvas id="calibrationChart"></canvas>
                </div>
            </div>

            <!-- League Performance Table -->
            <div class="table-card">
                <h3>🏆 联赛表现排名</h3>
                <table>
                    <thead>
                        <tr>
                            <th>联赛</th>
                            <th>预测次数</th>
                            <th>正确次数</th>
                            <th>准确率</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="league-table">
                        <!-- 数据将通过 JavaScript 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // GitHub Pages 部署版本 - 使用静态 JSON 数据
        // 本地开发时可改为：const DATA_BASE = 'http://192.168.0.104:8000/api';
        const DATA_BASE = './data';

        // 加载数据
        async function loadData() {
            try {
                // 加载统计信息
                const stats = await fetch(`${DATA_BASE}/stats.json`).then(r => r.json());
                updateStats(stats.overall);

                // 加载趋势数据
                const trend = await fetch(`${DATA_BASE}/trend.json`).then(r => r.json());
                renderTrendChart(trend);

                // 加载热力图数据
                const heatmap = await fetch(`${DATA_BASE}/heatmap.json`).then(r => r.json());
                renderCalibrationChart(heatmap);

                // 加载联赛表现
                const leagueStats = await fetch(`${DATA_BASE}/stats.json`).then(r => r.json());
                renderLeagueTable(leagueStats.by_league);

                // 加载联赛数量
                const leagues = await fetch(`${DATA_BASE}/leagues.json`).then(r => r.json());
                document.getElementById('active-leagues').textContent = leagues.length;

                // 显示内容
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('loading').innerHTML = '加载数据失败，请检查 API 服务是否运行';
            }
        }

        // 更新统计卡片
        function updateStats(stats) {
            document.getElementById('total-predictions').textContent = stats.total_predictions || 0;
            document.getElementById('accuracy').textContent = (stats.accuracy || 0).toFixed(1) + '%';
            document.getElementById('avg-confidence').textContent = (stats.avg_confidence || 0).toFixed(1) + '%';
        }

        // 渲染趋势图
        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [
                        {
                            label: '准确率 (%)',
                            data: data.map(d => d.accuracy),
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: '平均置信度 (%)',
                            data: data.map(d => d.avg_confidence),
                            borderColor: '#764ba2',
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: '预测数量',
                            data: data.map(d => d.prediction_count),
                            type: 'bar',
                            backgroundColor: 'rgba(102, 126, 234, 0.2)',
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            min: 0,
                            max: 100
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }

        // 渲染校准曲线
        function renderCalibrationChart(data) {
            const ctx = document.getElementById('calibrationChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => `${d.confidence_bin}-${d.confidence_bin + 10}%`),
                    datasets: [
                        {
                            label: '实际准确率',
                            data: data.map(d => d.actual_accuracy),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: '完美校准',
                            data: data.map(d => d.confidence_bin + 5),
                            borderColor: '#999',
                            borderDash: [5, 5],
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            min: 0,
                            max: 100
                        }
                    }
                }
            });
        }

        // 渲染联赛表格
        function renderLeagueTable(leagues) {
            const tbody = document.getElementById('league-table');
            tbody.innerHTML = leagues.map(league => `
                <tr>
                    <td>${league.league_name_cn || league.league_code}</td>
                    <td>${league.prediction_count}</td>
                    <td>${league.correct_count}</td>
                    <td>
                        <span class="badge ${getAccuracyBadge(league.accuracy)}">
                            ${league.accuracy.toFixed(1)}%
                        </span>
                    </td>
                    <td>
                        <span class="badge ${getStatusBadge(league.accuracy)}">
                            ${getStatusText(league.accuracy)}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // 辅助函数
        function getLastDays(days) {
            const date = new Date();
            date.setDate(date.getDate() - days);
            return date.toISOString().split('T')[0];
        }

        function getAccuracyBadge(accuracy) {
            if (accuracy >= 60) return 'badge-success';
            if (accuracy >= 50) return 'badge-warning';
            return 'badge-error';
        }

        function getStatusText(accuracy) {
            if (accuracy >= 60) return '优秀';
            if (accuracy >= 50) return '良好';
            return '待改进';
        }

        function getStatusBadge(accuracy) {
            return getAccuracyBadge(accuracy);
        }

        // 显示最后更新时间
        function updateLastUpdateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('last-update').textContent = timeStr + ' (北京时间)';
        }

        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateLastUpdateTime();
        });
    </script>
</body>
</html>
