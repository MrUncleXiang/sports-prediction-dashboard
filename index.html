<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育预测系统 - 联赛预测</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .last-update {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }

        /* 联赛切换按钮 */
        .league-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .league-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .league-btn:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.3);
        }

        .league-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .league-btn .count {
            font-size: 0.8em;
            margin-left: 8px;
            opacity: 0.8;
        }

        /* 内容区域 */
        .content-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .content-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .content-card h3 {
            color: #764ba2;
            margin: 25px 0 15px 0;
            font-size: 1.3em;
        }

        /* 参数网格 */
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .param-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .param-item label {
            display: block;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .param-item .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        /* 规则列表 */
        .rules-list {
            list-style: none;
            padding-left: 0;
        }

        .rules-list li {
            padding: 15px 20px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #10b981;
        }

        .rules-list li strong {
            color: #667eea;
        }

        /* 预测结果表格 */
        .predictions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .predictions-table th,
        .predictions-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .predictions-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        .predictions-table tr:hover {
            background: #f8f9fa;
        }

        /* 徽章 */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-info { background: #dbeafe; color: #1e40af; }

        /* 复盘分析 */
        .analysis-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .analysis-box h4 {
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .analysis-box p {
            line-height: 1.8;
            opacity: 0.95;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2em;
        }

        /* 隐藏/显示控制 */
        .league-content {
            display: none;
        }

        .league-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .league-tabs {
                flex-direction: column;
            }
            
            .league-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏆 体育预测系统 - 联赛预测</h1>
            <p>多联赛预测数据展示与分析</p>
            <p class="last-update">最后更新：<span id="last-update">加载中...</span></p>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            正在加载数据...
        </div>

        <!-- League Tabs -->
        <div id="league-tabs" class="league-tabs" style="display: none;">
            <!-- 按钮将通过 JavaScript 动态生成 -->
        </div>

        <!-- League Content -->
        <div id="league-content" style="display: none;">
            <!-- 内容将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <script>
        // 数据基础路径
        const DATA_BASE = './data';
        
        // 当前选中的联赛
        let currentLeague = null;
        
        // 联赛配置
        const LEAGUES = {
            'epl': { name: '英超', icon: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', color: '#3D195B' },
            'laliga': { name: '西甲', icon: '🇪🇸', color: '#FF4E4E' },
            'bundesliga': { name: '德甲', icon: '🇩🇪', color: '#D20515' },
            'seriea': { name: '意甲', icon: '🇮🇹', color: '#008FD7' },
            'ligue1': { name: '法甲', icon: '🇫🇷', color: '#00235B' }
        };

        // 加载数据
        async function loadData() {
            try {
                // 加载联赛列表
                const leaguesData = await fetch(`${DATA_BASE}/leagues.json`).then(r => r.json());
                
                // 加载预测数据
                const predictionsData = await fetch(`${DATA_BASE}/predictions.json`).then(r => r.json());
                
                // 加载模型数据
                const modelsData = await fetch(`${DATA_BASE}/models.json`).then(r => r.json());
                
                // 渲染联赛按钮
                renderLeagueButtons(leaguesData, predictionsData);
                
                // 默认显示第一个联赛
                if (leaguesData.length > 0) {
                    switchLeague(leaguesData[0], predictionsData, modelsData);
                }
                
                // 显示内容
                document.getElementById('loading').style.display = 'none';
                document.getElementById('league-tabs').style.display = 'flex';
                document.getElementById('league-content').style.display = 'block';
                
                // 更新时间
                document.getElementById('last-update').textContent = new Date().toLocaleString('zh-CN');
                
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('loading').innerHTML = `
                    加载数据失败<br>
                    <small style="opacity: 0.8;">${error.message}</small><br><br>
                    <button onclick="location.reload()" style="padding: 10px 20px; border: none; border-radius: 5px; background: white; color: #667eea; cursor: pointer;">刷新页面</button>
                `;
            }
        }

        // 渲染联赛按钮
        function renderLeagueButtons(leagues, predictions) {
            const tabsContainer = document.getElementById('league-tabs');
            tabsContainer.innerHTML = '';
            
            leagues.forEach(leagueCode => {
                const league = LEAGUES[leagueCode] || { name: leagueCode, icon: '🏆', color: '#667eea' };
                const count = predictions[leagueCode]?.length || 0;
                
                const btn = document.createElement('button');
                btn.className = 'league-btn';
                btn.innerHTML = `${league.icon} ${league.name} <span class="count">(${count}场)</span>`;
                btn.onclick = () => switchLeague(leagueCode, predictions, null);
                
                tabsContainer.appendChild(btn);
            });
        }

        // 切换联赛
        function switchLeague(leagueCode, predictions, models) {
            currentLeague = leagueCode;
            
            // 更新按钮状态
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(LEAGUES[leagueCode]?.name || leagueCode)) {
                    btn.classList.add('active');
                }
            });
            
            // 渲染内容
            renderLeagueContent(leagueCode, predictions, models);
        }

        // 渲染联赛内容
        function renderLeagueContent(leagueCode, predictions, models) {
            const contentContainer = document.getElementById('league-content');
            const league = LEAGUES[leagueCode] || { name: leagueCode, icon: '🏆', color: '#667eea' };
            const leaguePredictions = predictions[leagueCode] || [];
            const recent20 = leaguePredictions.slice(0, 20);
            
            // 计算统计数据
            const correctCount = recent20.filter(p => p.correct).length;
            const accuracy = recent20.length > 0 ? (correctCount / recent20.length * 100).toFixed(1) : 0;
            const avgConfidence = recent20.length > 0 
                ? (recent20.reduce((sum, p) => sum + (p.confidence || 0), 0) / recent20.length).toFixed(1) 
                : 0;
            
            let html = `
                <div class="content-card">
                    <h2>${league.icon} ${league.name} - 预测参数</h2>
                    
                    <div class="params-grid">
                        <div class="param-item">
                            <label>📊 模型类型</label>
                            <div class="value">Random Forest</div>
                        </div>
                        <div class="param-item">
                            <label>🎯 模型准确率</label>
                            <div class="value">${accuracy}%</div>
                        </div>
                        <div class="param-item">
                            <label>📈 平均置信度</label>
                            <div class="value">${avgConfidence}%</div>
                        </div>
                        <div class="param-item">
                            <label>📉 特征数量</label>
                            <div class="value">8</div>
                        </div>
                    </div>
                </div>

                <div class="content-card">
                    <h2>📋 预测规则与方式</h2>
                    
                    <h3>核心特征</h3>
                    <ul class="rules-list">
                        <li><strong>球队 ID 编码</strong> - 使用历史数据对球队进行唯一编码</li>
                        <li><strong>近期战绩</strong> - 计算球队近 5 场比赛的平均表现</li>
                        <li><strong>进球差趋势</strong> - 分析球队进攻和防守能力变化</li>
                        <li><strong>主客场优势</strong> - 考虑主场作战的额外加成</li>
                        <li><strong>联赛特征</strong> - 不同联赛的风格差异编码</li>
                    </ul>
                    
                    <h3>预测方式</h3>
                    <ul class="rules-list">
                        <li><strong>三分类模型</strong> - 预测主胜/平局/客胜三种结果</li>
                        <li><strong>置信度评分</strong> - 每个预测附带 0-100% 的置信度</li>
                        <li><strong>滚动更新</strong> - 每场比赛后自动更新球队特征</li>
                        <li><strong>跨联赛训练</strong> - 使用多联赛数据联合训练提升泛化能力</li>
                    </ul>
                </div>

                <div class="content-card">
                    <h2>📊 最近 20 场预测结果</h2>
                    
                    <table class="predictions-table">
                        <thead>
                            <tr>
                                <th>比赛时间</th>
                                <th>主队</th>
                                <th>客队</th>
                                <th>预测</th>
                                <th>置信度</th>
                                <th>实际比分</th>
                                <th>实际结果</th>
                                <th>预测状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${recent20.map(p => `
                                <tr>
                                    <td>${formatDate(p.match_date)}</td>
                                    <td>${p.home_team}</td>
                                    <td>${p.away_team}</td>
                                    <td>${getPredictionText(p.predicted)}</td>
                                    <td>
                                        <span class="badge ${getConfidenceBadge(p.confidence)}">
                                            ${(p.confidence || 0).toFixed(0)}%
                                        </span>
                                    </td>
                                    <td>${p.actual_score || '待进行'}</td>
                                    <td>${p.actual_result || '-'}</td>
                                    <td>
                                        ${p.correct !== undefined ? 
                                            `<span class="badge ${p.correct ? 'badge-success' : 'badge-error'}">
                                                ${p.correct ? '✅ 正确' : '❌ 错误'}
                                            </span>` : 
                                            '<span class="badge badge-info">待验证</span>'
                                        }
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="content-card">
                    <h2>🔍 预测分析与复盘</h2>
                    
                    <div class="analysis-box">
                        <h4>📈 整体表现分析</h4>
                        <p>
                            ${league.name}最近 20 场预测中，正确${correctCount}场，错误${20 - correctCount}场，
                            准确率<strong>${accuracy}%</strong>。平均置信度为<strong>${avgConfidence}%</strong>。
                            ${accuracy >= 70 ? '预测表现优秀，模型对该联赛的把握度较高。' : 
                              accuracy >= 55 ? '预测表现良好，仍有提升空间。' : 
                              '预测表现一般，需要进一步优化模型参数。'}
                        </p>
                    </div>
                    
                    <div class="analysis-box" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <h4>✅ 成功案例分析</h4>
                        <p>
                            ${getSuccessAnalysis(recent20.filter(p => p.correct))}
                        </p>
                    </div>
                    
                    <div class="analysis-box" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                        <h4>❌ 失败案例复盘</h4>
                        <p>
                            ${getFailureAnalysis(recent20.filter(p => p.correct === false))}
                        </p>
                    </div>
                    
                    <div class="analysis-box" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                        <h4>💡 优化建议</h4>
                        <p>
                            ${getOptimizationSuggestions(leagueCode, accuracy)}
                        </p>
                    </div>
                </div>
            `;
            
            contentContainer.innerHTML = html;
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', { 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 获取预测文本
        function getPredictionText(predicted) {
            const map = {
                0: '客胜',
                1: '平局',
                2: '主胜'
            };
            return map[predicted] || predicted;
        }

        // 获取置信度徽章样式
        function getConfidenceBadge(confidence) {
            if (confidence >= 70) return 'badge-success';
            if (confidence >= 50) return 'badge-warning';
            return 'badge-info';
        }

        // 成功案例分析
        function getSuccessAnalysis(successes) {
            if (successes.length === 0) return '暂无成功案例数据。';
            
            const highConfCorrect = successes.filter(s => s.confidence >= 70).length;
            return `在${successes.length}场成功预测中，有${highConfCorrect}场是高置信度（≥70%）预测，
                    占比${(highConfCorrect / successes.length * 100).toFixed(0)}%。
                    这表明模型在把握度较高的比赛中表现更加稳定，特征工程有效地捕捉到了比赛的关键因素。`;
        }

        // 失败案例分析
        function getFailureAnalysis(failures) {
            if (failures.length === 0) return '暂无失败案例，表现优秀！';
            
            const avgConf = failures.reduce((sum, f) => sum + (f.confidence || 0), 0) / failures.length;
            return `在${failures.length}场失败预测中，平均置信度为${avgConf.toFixed(1)}%。
                    ${avgConf >= 60 ? '值得注意的是，部分高置信度预测也出现了错误，这可能是因为足球比赛本身存在较大偶然性，
                    或者某些关键特征（如球员伤病、临场状态）未被充分捕捉。' : 
                    '失败案例多为低置信度预测，说明模型对这些比赛的把握度本身就较低，
                    这类比赛的预测结果仅供参考。'}`;
        }

        // 优化建议
        function getOptimizationSuggestions(leagueCode, accuracy) {
            if (accuracy >= 70) {
                return `当前${leagueCode}的预测准确率已达到${accuracy}%，表现优秀。
                        建议：1) 继续保持现有模型参数；2) 可以考虑增加更多特征（如球员数据、天气因素）；
                        3) 尝试集成学习方法进一步提升准确率。`;
            } else if (accuracy >= 55) {
                return `${leagueCode}的预测准确率为${accuracy}%，表现良好但有提升空间。
                        建议：1) 增加该联赛的历史数据量；2) 调整特征权重，可能需要更多关注近期战绩；
                        3) 考虑针对该联赛单独训练模型。`;
            } else {
                return `${leagueCode}的预测准确率为${accuracy}%，需要进一步优化。
                        建议：1) 检查数据质量，确保球队名称、比分等信息准确；
                        2) 增加训练数据量，至少需要 500+ 场比赛；
                        3) 尝试不同的模型算法（如 XGBoost、LightGBM）；
                        4) 考虑引入更多特征（如赔率数据、球员身价等）。`;
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
